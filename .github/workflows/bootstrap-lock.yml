name: 01 — Generate dependency lock (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lock-bootstrap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Generate candidate lock from npm — never silently overwrite
        run: npm run bootstrap:lock
      - name: Verify lock structure
        run: npm run check:lock
      - name: Demonstrate clean dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record dependency audit for human review
        id: audit
        continue-on-error: true
        run: npm audit --json > qualification/dependency-audit.json
      - name: Compute candidate fingerprint
        run: npm run fingerprint
      - name: Explain next step
        run: |
          echo '## Candidate lock, not a release approval' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download dependency-lock-candidate below. Review package-lock.json and the audit. Upload only the lock to the repository root in a new commit. Then check workflow 02.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Audit step outcome: ${{ steps.audit.outcome }}. A generated lock does not certify dependency safety or authorize deployment.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve candidate and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-lock-candidate
          path: |
            package-lock.json
            qualification/lock-bootstrap.json
            qualification/lock-bootstrap.log
            qualification/dependency-audit.json
            qualification/SOURCE_DIGEST.json
          if-no-files-found: error
          retention-days: 14
