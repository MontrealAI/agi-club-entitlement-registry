name: 02 — Build and qualify (no deployment)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Repository and authentic lock are mandatory
        run: |
          npm run check:repo
          npm run check:lock
      - name: Clean install — no package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dependency advisory gate
        run: npm audit --audit-level=high
      - name: Complete local qualification
        run: npm run qualify
      - name: Preserve local evidence (not mainnet clearance)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-qualification-linux
          path: qualification/
          if-no-files-found: warn
          retention-days: 30
      - name: Export unconfigured public build for staging only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-site-staging-not-deployed
          path: dist/site/
          if-no-files-found: error
          retention-days: 14
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run check:lock
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:repo
      - run: npm test
      - run: npm run build:site
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portability-${{ matrix.os }}
          path: qualification/
          if-no-files-found: warn
          retention-days: 14
